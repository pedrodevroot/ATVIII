# ===== Banco de dados: PostgreSQL =====
# Dentro do Docker, DB_HOST/DB_PORT vem do docker-compose.yml.
# Fora do Docker (rodando pela IDE ou pelo Maven), cai nos defaults
# e conecta no container do Postgres pela porta publicada no host.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/autobots
spring.datasource.username=autobots
spring.datasource.password=autobots

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== JSON =====
spring.jackson.default-property-inclusion=non_null
